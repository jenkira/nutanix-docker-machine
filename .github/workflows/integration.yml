name: Integration

on:
  push:
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint Go Code
        run: |
          # Pinned rather than @latest: staticcheck v0.8.x requires Go >= 1.26,
          # ahead of this repo's go.mod (go 1.25.0), and would otherwise break
          # every PR the moment a newer staticcheck release ships. v0.7.0 is
          # the latest release that still matches our Go version.
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet Go code
        run: go vet ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compile
        run: go build -v -o build/docker-machine-driver-nutanix machine/main.go

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        env:
           TRIVY_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db"
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          exit-code: "1"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          skip-dirs: "ui"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          # Artifact name
          name: docker-machine-driver-nutanix
          # Directory containing files to upload
          path: build/docker-machine-driver-nutanix
